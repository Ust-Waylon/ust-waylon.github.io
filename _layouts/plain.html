---
layout: default
---

{% include base_path %}

<main class="shell">
  <header class="page-head">
    <h1 class="page-head__title">{{ page.title }}</h1>
    {% if page.lede %}<p class="page-head__lede">{{ page.lede | markdownify | remove: '<p>' | remove: '</p>' | strip }}</p>{% endif %}
    {% if page.pdf %}
      <p class="page-head__actions">
        <a class="button" href="{{ base_path }}{{ page.pdf }}"><i class="fas fa-file-arrow-down" aria-hidden="true"></i>Download PDF</a>
      </p>
    {% endif %}
  </header>

  {{ content }}
</main>
